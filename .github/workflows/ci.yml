name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag tinshed-roster:ci .
      - name: Verify health and persisted fictional data
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/tinshed-data"
          mkdir -p "$data_dir"
          cleanup() { docker rm -f tinshed-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          start_container() {
            docker run -d --name tinshed-ci \
              -e SECRET_KEY=ci-only-not-for-deployment \
              -v "$data_dir:/data" \
              -p 127.0.0.1:18000:8000 tinshed-roster:ci
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:18000/health | grep -q '"status":"ok"'; then
                return 0
              fi
              sleep 1
            done
            docker logs tinshed-ci
            return 1
          }
          start_container
          docker exec tinshed-ci python -m flask --app app seed-demo
          docker rm -f tinshed-ci
          start_container
          curl --fail --silent http://127.0.0.1:18000/volunteers | grep -q 'Alex Morgan'
